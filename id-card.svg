<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="'Segoe UI','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- white card -->
  <rect x="4" y="4" width="592" height="372" rx="26" fill="#ffffff" stroke="#f3a6c0" stroke-width="3"/>
  <rect x="14" y="14" width="572" height="352" rx="20" fill="none" stroke="#fbd3e1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- number badge + title -->
  <rect x="32" y="30" width="52" height="52" rx="14" fill="#fff" stroke="#e8809f" stroke-width="3"/>
  <text x="58" y="68" text-anchor="middle" font-size="30" font-weight="800" fill="#e8809f">10</text>
  <text x="98" y="68" font-size="30" font-weight="800" fill="#e8809f" letter-spacing="1">ID-CARD.</text>
  <circle cx="300" cy="55" r="16" fill="#fff6d6" stroke="#f2c14e" stroke-width="2"/>
  <text x="300" y="62" text-anchor="middle" font-size="18" fill="#f2c14e">★</text>
  <circle cx="338" cy="55" r="16" fill="#e9f3ff" stroke="#7fb2f0" stroke-width="2"/>
  <text x="338" y="61" text-anchor="middle" font-size="16" fill="#7fb2f0">☾</text>

  <!-- fields -->
  <g font-size="19" fill="#c25577">
    <text x="36" y="132">♥  name :</text>
    <text x="36" y="196">♥  class :</text>
    <text x="36" y="226">♥  dob :</text>
    <text x="36" y="256">♥  country :</text>
  </g>
  <g fill="#4a3b47">
    <text x="140" y="132" font-size="22" font-weight="700">Ayyoob</text>
    <text x="140" y="162" font-size="22" font-weight="700">아유브</text>
    <text x="130" y="196" font-size="19">Developer</text>
    <text x="115" y="226" font-size="19">DD/MM/YYYY</text>
    <text x="152" y="256" font-size="19">Your Country</text>
  </g>

  <!-- barcode -->
  <line x1="36" y1="300" x2="190" y2="300" stroke="#222" stroke-width="40" stroke-dasharray="2 3 1 2 4 2 1 3 3 2 1 2 2 4 1 3 2 2 3 1 2 3 1 2 4 2 1 3 2 3 1 2 2 1 3 2 4 2 1 3"/>
  <text x="36" y="338" font-size="12" fill="#444" letter-spacing="2">0 3 1 7 2 0 1 6</text>

  <!-- little stickers -->
  <g transform="translate(215,285)">
    <rect width="62" height="58" rx="8" fill="#fff0f4" stroke="#e8809f" stroke-width="2"/>
    <text x="31" y="38" text-anchor="middle" font-size="26" fill="#e8809f">♥</text>
  </g>
  <g transform="translate(290,285) rotate(-4)">
    <rect width="56" height="58" rx="6" fill="#fff" stroke="#e8809f" stroke-width="2"/>
    <text x="28" y="40" text-anchor="middle" font-size="28" font-weight="800" fill="#e8809f">A+</text>
  </g>

  <!-- character frame -->
  <rect x="372" y="52" width="206" height="296" rx="26" fill="#fffafc" stroke="#f3a6c0" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="552" y="82" font-size="20" fill="#f2a1bc">✦</text>
  <text x="392" y="326" font-size="18" fill="#f7c3d4">✧</text>

  <!-- anime character (original) -->
  <!-- hair back -->
  <ellipse cx="475" cy="190" rx="68" ry="76" fill="#22223a"/>
  <!-- hoodie -->
  <path d="M388 348 Q392 268 475 258 Q558 268 562 348 Z" fill="#cfe3ff" stroke="#8fb5ee" stroke-width="2"/>
  <path d="M440 262 Q475 290 510 262" fill="none" stroke="#8fb5ee" stroke-width="3"/>
  <line x1="462" y1="282" x2="460" y2="318" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <line x1="488" y1="282" x2="490" y2="318" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="456" y="236" width="38" height="30" rx="10" fill="#ffe0cc"/>
  <!-- face -->
  <ellipse cx="475" cy="192" rx="56" ry="62" fill="#ffe6d6"/>
  <!-- fringe -->
  <path d="M414 190 Q408 118 475 108 Q542 118 536 190 Q522 152 502 150 Q490 168 476 150 Q460 170 446 152 Q424 158 414 190 Z" fill="#22223a"/>
  <path d="M440 125 Q470 112 505 124" fill="none" stroke="#4a4a6e" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="452" cy="196" rx="9" ry="13" fill="#3b2a5a"/>
  <circle cx="455" cy="191" r="3.5" fill="#fff"/>
  <circle cx="449" cy="201" r="1.8" fill="#fff"/>
  <path d="M490 198 Q500 187 511 198" fill="none" stroke="#3b2a5a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- brows -->
  <path d="M441 176 Q452 171 462 176" fill="none" stroke="#22223a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M490 176 Q501 171 511 176" fill="none" stroke="#22223a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- blush + smile -->
  <ellipse cx="438" cy="216" rx="9" ry="5" fill="#ffb3c6" opacity=".8"/>
  <ellipse cx="514" cy="216" rx="9" ry="5" fill="#ffb3c6" opacity=".8"/>
  <path d="M463 223 Q476 238 489 223 Z" fill="#c25577" stroke="#c25577" stroke-width="2" stroke-linejoin="round"/>
  <!-- headphones -->
  <path d="M410 190 Q410 108 475 106 Q540 108 540 190" fill="none" stroke="#f3a6c0" stroke-width="7" stroke-linecap="round"/>
  <rect x="402" y="178" width="16" height="34" rx="8" fill="#f3a6c0"/>
  <rect x="532" y="178" width="16" height="34" rx="8" fill="#f3a6c0"/>
  <!-- floating hearts -->
  <text x="542" y="120" font-size="22" fill="#f08aa8">♥</text>
  <text x="388" y="140" font-size="16" fill="#f7b0c5">♥</text>
</svg>
